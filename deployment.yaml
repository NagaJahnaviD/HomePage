apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      containers:
        - name: student-container
          image: student-crud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
