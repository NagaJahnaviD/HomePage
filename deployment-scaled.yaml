apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-scaled
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-scaled
  template:
    metadata:
      labels:
        app: student-scaled
    spec:
      containers:
        - name: student-container
          image: student-crud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
